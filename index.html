<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Отправить план</title>
  <link rel="stylesheet" href="inbox.css">
  <script src="inbox.js" defer></script>
</head>
<body>
  <main>
    <h1>Отправить план</h1>
    <p class="lead">План ляжет в ящик Backblaze. Mac заберёт его, когда включится.</p>

    <section class="card" id="setup" hidden>
      <h2>Доступ к ящику</h2>
      <p class="muted small">Один раз на этом телефоне. Ключ хранится только в этом браузере.</p>
      <form id="setup-form" autocomplete="off">
        <label>Адрес (S3 Endpoint)
          <input name="endpoint" required placeholder="s3.регион.backblazeb2.com" inputmode="url">
        </label>
        <label>Бакет-ящик
          <input name="bucket" required placeholder="имя бакета">
        </label>
        <label>keyID
          <input name="keyId" required autocapitalize="off" spellcheck="false">
        </label>
        <label>applicationKey
          <input name="appKey" type="password" required autocapitalize="off" spellcheck="false">
        </label>
        <button type="submit">Сохранить</button>
      </form>
    </section>

    <section class="card" id="send" hidden>
      <h2>Новый план</h2>
      <form id="send-form">
        <fieldset class="tabs">
          <label><input type="radio" name="source" value="file" checked> Файлы</label>
          <label><input type="radio" name="source" value="drive"> Ссылка Google</label>
        </fieldset>
        <div data-source="file">
          <label>Таблица (.xlsx или .csv)
            <input name="table" type="file" accept=".xlsx,.csv">
          </label>
          <label>Медиа или один ZIP (необязательно)
            <input name="media" type="file" multiple>
          </label>
        </div>
        <div data-source="drive" hidden>
          <label>Ссылка на Google Таблицу или папку Drive
            <input name="driveUrl" type="url" placeholder="https://drive.google.com/…">
          </label>
        </div>
        <label>Название (необязательно)
          <input name="planName" maxlength="200" placeholder="Ноябрь">
        </label>
        <details>
          <summary>Для плана по рубрикам</summary>
          <label>Дата начала
            <input name="startDate" type="date">
          </label>
          <label>Аккаунты (через запятую)
            <input name="channels" placeholder="Моя страница, 3">
          </label>
        </details>
        <button type="submit" id="send-button">Отправить</button>
        <progress id="progress" max="1" value="0" hidden></progress>
        <p id="send-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" id="calendar" hidden>
      <div class="row">
        <h2>Календарь</h2>
        <button type="button" id="calendar-refresh" class="secondary">Обновить</button>
      </div>
      <p id="calendar-stamp" class="muted small"></p>
      <p id="calendar-warning" class="banner" role="status" hidden></p>
      <div id="calendar-days"></div>
    </section>

    <section class="card" id="history" hidden>
      <div class="row">
        <h2>Отправленные</h2>
        <button type="button" id="refresh" class="secondary">Обновить</button>
      </div>
      <p id="history-empty" class="muted small">Пока ничего не отправлено.</p>
      <ul id="sends"></ul>
    </section>

    <p class="foot"><button type="button" id="forget" class="link" hidden>Забыть ключ</button></p>
  </main>
</body>
</html>
