<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>autopost</title>
  <link rel="stylesheet" href="inbox.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <section id="setup" class="login-wrap" hidden>
    <div class="card login-card">
      <h1>autopost</h1>
      <p class="muted">Доступ к ящику Backblaze — один раз на этом устройстве. Ключ хранится только в этом браузере.</p>
      <form id="setup-form" class="form" autocomplete="off">
        <label class="field">Адрес (S3 Endpoint)
          <input name="endpoint" type="text" required placeholder="s3.регион.backblazeb2.com" inputmode="url">
        </label>
        <label class="field">Бакет-ящик
          <input name="bucket" type="text" required placeholder="имя бакета">
        </label>
        <label class="field">keyID
          <input name="keyId" type="text" required autocapitalize="off" spellcheck="false">
        </label>
        <label class="field">applicationKey
          <input name="appKey" type="password" required autocapitalize="off" spellcheck="false">
        </label>
        <button type="submit" class="primary large">Войти</button>
      </form>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand">autopost</span>
        <nav aria-label="Разделы">
          <button type="button" data-screen="upload">Загрузить план</button>
          <button type="button" data-screen="calendar">Календарь</button>
          <button type="button" data-screen="accounts">Аккаунты</button>
          <button type="button" data-screen="reviews">Отзывы</button>
          <button type="button" data-screen="journal">Журнал</button>
        </nav>
        <span id="mac-pill" class="mac-pill" role="status" aria-live="polite">Проверяю связь с Mac…</span>
      </div>
    </header>
    <main>
      <p id="problem" class="notice error-box" role="alert" hidden></p>
      <section id="screen-upload" aria-label="Загрузить план"></section>
      <section id="screen-calendar" aria-label="Календарь" hidden></section>
      <section id="screen-accounts" aria-label="Аккаунты" hidden></section>
      <section id="screen-reviews" aria-label="Отзывы" hidden></section>
      <section id="screen-journal" aria-label="Журнал" hidden></section>
      <p class="foot"><button type="button" id="forget" class="link">Забыть ключ</button></p>
    </main>
  </div>
</body>
</html>
